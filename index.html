<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Lazer Tag Environment</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div id="instructions">
    <h1>ORB ROBOT</h1>
    <p>CLICK TO START</p>
    <div class="codex-build-tag">CODEX v2.0</div>
    <div class="controls-hint">
      <span class="key-hint">W,A,S,D</span> MOVE | 
      <span class="key-hint">SPACE</span> JETPACK | 
      <span class="key-hint">MOUSE</span> AIM & FIRE | 
      <span class="key-hint">M</span> SETTINGS |
      <span class="key-hint">T</span> TELEPORT
    </div>
  </div>
  <div id="teleport-overlay" style="display:none;">
    <div id="teleport-label">CLICK ANYWHERE ON THE MAP TO SPAWN</div>
    <button id="exit-teleport">CANCEL</button>
  </div>
  <div id="crosshair"></div>
  <div id="minimap-container">
    <div id="minimap-label">Minimap</div>
  </div>
  <div id="charge-bar">
    <div id="charge-fill"></div>
  </div>
  
  <div id="mobile-controls">
    <div id="touch-zone-move">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>
    <div id="touch-zone-look"></div>
    <div class="mobile-buttons">
      <button id="btn-shield" class="m-btn">🛡️</button>
      <button id="btn-jetpack" class="m-btn">🚀</button>
      <button id="btn-fire" class="m-btn">🎯</button>
      <button id="btn-menu" class="m-btn">⚙️</button>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>

</html>
