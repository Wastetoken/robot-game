<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Lazer Tag Environment</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="instructions">
      <h1>ENTER ARENA</h1>
      <p>
        <span class="key-hint">W</span>
        <span class="key-hint">A</span>
        <span class="key-hint">S</span>
        <span class="key-hint">D</span> to move
        &nbsp;&nbsp;|&nbsp;&nbsp;
        <span class="key-hint">SPACE</span> to jump
        &nbsp;&nbsp;|&nbsp;&nbsp;
        MOUSE to look
      </p>
      <p style="margin-top: 40px; font-size: 0.9rem; opacity: 0.7;">Click anywhere to start</p>
    </div>
    <div id="crosshair"></div>
    <div id="charge-bar"><div id="charge-fill"></div></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
